# Keeps the SHA-pinned actions in .github/workflows current: Dependabot proposes the new commit
# SHA and rewrites the trailing `# vX.Y.Z` comment with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all actions, so upload-artifact and download-artifact move together.
    groups:
      github-actions:
        patterns: ["*"]
