name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Read-only token for every job. A caller (release.yml) may grant no more than it holds, and
# nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` runs steps as `bash --noprofile --norc -eo pipefail {0}`. The implicit default is
# `bash -e {0}` WITHOUT pipefail, under which a failed curl on the left of a pipe went green.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth for the toolchain
        # version. The script fetches install.sh from that TAG (not main) and the release tarball,
        # checks both against sha256s committed in the script, and fails closed on a pin it has no
        # hashes for — bump the hashes with the pin.
        run: bash scripts/ci-install-cyrius.sh

      - name: Resolve dependencies (lock gate)
        # `cyrius deps` copies the [deps].stdlib modules from the installed toolchain into lib/ and
        # clones the [deps.sadish] git dep at its tag, verifying the commit pinned in cyrius.lock.
        # Never symlink lib/ to a cyrius checkout (cross-repo writes).
        # ⛔ A live `path =` in a [deps*] section WINS over `tag` and skips the commit-pin verify,
        # so the manifest is refused before resolving. Comment lines (the [deps.rekha] consumer
        # example) are skipped.
        # ⛔ The committed cyrius.lock must equal a clean resolve. A lock regenerated over a stale
        # local lib/ carries entries no manifest asks for; `rm -rf lib && cyrius deps` and commit.
        run: |
          # Whole-file, not per-section: cbt keeps reading a [deps.X] section across a following
          # `[d…]` or `[[…]]` header, which a section-tracking guard would treat as closed.
          if grep -nE '^[[:space:]]*path[[:space:]]*=' cyrius.cyml; then
            echo "ERROR: cyrius.cyml has a live 'path =' dep line (above). Keep path overrides in an uncommitted working copy."
            exit 1
          fi
          rm -rf lib
          mkdir lib
          cyrius deps
          if ! git diff --exit-code -- cyrius.lock; then
            echo "ERROR: cyrius.lock does not match a clean resolve. Run 'rm -rf lib && cyrius deps' and commit cyrius.lock."
            exit 1
          fi
          echo "cyrius.lock matches a clean resolve"

      - name: Lint
        # Hard gate: fails on any `warn` line, any untracked `deferral` line (cyrlint prints those
        # on stderr, hence 2>&1), or a non-zero lint rc (read errors, too-large files). The rc is
        # captured with `|| rc=$?` so -e does not end the loop at the first failing file.
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr; do
            [ -e "$f" ] || continue
            rc=0
            out=$(cyrius lint "$f" --strict 2>&1) || rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ] || grep -qE '^[[:space:]]*(warn|deferral) ' <<< "$out"; then
              echo "lint: $f failed (rc=$rc)"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings, deferrals or errors present"; exit 1; }

      - name: Format check
        # ⛔ `cyrius fmt <file> --check` IS A FALSE NEGATIVE ON 6.6.6, so this step no longer gates
        # on its exit code. MEASURED at the 0.4.5 bump against sadish's `programs/paint_focal_test.cyr`
        # @0.9.0 — the file sadish filed this on: `--check` exits **0**, and formatting the same file
        # in place rewrites it in THREE places (continuation lines at 12 spaces where 6.6.6 wants 10).
        # A gate reading that exit code cannot catch the drift it exists to catch.
        # ⇒ Format in place on the clean checkout and let `git diff --exit-code` report. That cannot
        # silently agree: the diff IS the formatter's own output. `lib/` and `/build/` are gitignored,
        # so only tracked source can dirty the tree here.
        # ⚠ rekha's own files do NOT drift — measured, 0 of 33 in src/ + programs/ under the 6.6.6
        # formatter, and `--check` agrees on all 33. This is the gate being repaired, not the tree.
        run: |
          for f in src/*.cyr programs/*.cyr; do
            [ -e "$f" ] || continue
            cyrius fmt "$f" > /dev/null 2>&1 || { echo "fmt: failed to format $f"; exit 1; }
          done
          if ! git diff --exit-code; then
            echo "fmt: drift detected (the diff above is what 'cyrius fmt' rewrote)."
            echo 'Run: for f in src/*.cyr programs/*.cyr; do cyrius fmt "$f"; done  -- and commit.'
            exit 1
          fi
          echo "fmt: clean (formatted in place, tree unchanged)"

      - name: Vet
        run: cyrius vet programs/smoke.cyr

      - name: Verify dist/ is in sync with src/ (bundle + sidecar)
        # `--check` verifies dist/rekha.cyr AND dist/rekha.deps (and every [lib.*] profile) without
        # writing; `git diff dist/rekha.cyr` after a regenerate missed a stale sidecar. The
        # porcelain test catches a bundle or leftover that is not committed at all.
        # ⛔ `--all`, not a bare `cyrius distlib`: MEASURED at the 0.4.5 bump, a bare run regenerates
        # the BASE bundle only and leaves the [lib.woff] profile exactly as it found it, so following
        # the old message here left dist/rekha-woff.cyr stale and `--check` still red.
        run: |
          if ! cyrius distlib --check; then
            echo "ERROR: dist/ is stale. Run 'cyrius distlib --all' and commit dist/."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --porcelain -- dist/
            echo "ERROR: dist/ has uncommitted or untracked files."
            exit 1
          fi
          echo "dist/ matches src/"

      - name: Pin the published leaf requirements (dist/*.deps)
        # `--check` above only proves the sidecar matches src/ — it passes just as happily on a
        # sidecar that has GROWN. Every leaf named in dist/rekha.deps is one each consumer must
        # vendor, and the way it grows is quiet: one `include "lib/fmt.cyr"` added to src/lib.cyr
        # for convenience (distlib scans that exact file and unions `[deps] stdlib`), or a leaf
        # added back to that array. rekha 0.4.3 shipped nine leaves for a bundle whose entire
        # stdlib appetite is strlen + memcpy; 0.4.4 cut it to two and 0.4.5 to ONE.
        # ⚠ `alloc` LEFT this list in 0.4.5 and the BUNDLE did not change — the toolchain did.
        # Through 6.6.4 `lib/string.cyr` called alloc() (strdup/strndup) and declared no include for
        # it, so distlib's compile-verify had to re-add the leaf; 6.6.6 makes that file self-sufficient
        # (`include "lib/alloc.cyr"`, cyrius CHANGELOG [6.6.6]), so alloc now arrives TRANSITIVELY
        # with string and is no longer a leaf the consumer has to name. It is still linked, and
        # nothing about what the bundle CALLS moved.
        # ⛔ This makes the sidecar toolchain-dependent: a consumer BELOW 6.6.6 that vendors only
        # `string` gets `warning: undefined function 'alloc'`, and a strdup/strndup call traps (SIGILL).
        # Consumers of dist/rekha.cyr 0.4.5 and up must be on 6.6.6 or later — rekha's own pin.
        # CHANGING THIS LIST IS A DELIBERATE ACT — a consumer-visible change that belongs in its
        # own release with a CHANGELOG line, not a drive-by. Update it here when you mean it.
        run: |
          expect_base="string"
          expect_woff="string sankoch"
          got_base="$(grep -v '^#' dist/rekha.deps | tr -s '\n' ' ' | sed 's/ *$//')"
          got_woff="$(grep -v '^#' dist/rekha-woff.deps | tr -s '\n' ' ' | sed 's/ *$//')"
          rc=0
          if [ "$got_base" != "$expect_base" ]; then
            echo "ERROR: dist/rekha.deps changed: expected [$expect_base], got [$got_base]"
            rc=1
          fi
          if [ "$got_woff" != "$expect_woff" ]; then
            echo "ERROR: dist/rekha-woff.deps changed: expected [$expect_woff], got [$got_woff]"
            rc=1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "A consumer of dist/rekha.cyr must vendor every leaf listed there."
            echo "If the change is intended, update the expected list in this step and say so in CHANGELOG.md."
            exit 1
          fi
          echo "leaf requirements pinned: base [$got_base], woff [$got_woff]"

      - name: Verify the WOFF2 triplet vectors match the W3C table
        # ⭐ WHY THIS GATE EXISTS. src/woff2.cyr decodes a point coordinate with ARITHMETIC where the
        # spec gives a 128-row table (WOFF 2.0, 5.2) — no literal table in the library, at the cost
        # of a closed form that a round-trip test CANNOT check, because programs/woff2_test.cyr's
        # own encoder would share any mistake in it. programs/woff2_vectors.cyr is the independent
        # half: the expected dx / dy for all 128 indices under two byte patterns, computed from the
        # spec's table and from nothing in rekha. Same shape as the fonts/face_data.cyr gate below.
        # ⚠ The table is TRANSCRIBED into scripts/woff2_triplet.py, so this gate needs no network;
        # `python3 scripts/woff2_triplet.py verify <spec.html>` re-audits it against the W3C source
        # when the spec moves, and is deliberately not run here.
        run: |
          regen="$RUNNER_TEMP/woff2_vectors.regen.cyr"
          python3 scripts/woff2_triplet.py emit "$regen"
          if ! cmp -s programs/woff2_vectors.cyr "$regen"; then
            echo "ERROR: programs/woff2_vectors.cyr is stale."
            echo "Run 'python3 scripts/woff2_triplet.py emit' and commit the result."
            exit 1
          fi
          echo "programs/woff2_vectors.cyr matches the W3C triplet table"

      - name: Verify the CFF Standard Encoding vectors
        # Same shape as the triplet gate above, for the other table rekha expresses as arithmetic:
        # src/cff.cyr turns a `seac`'s bchar / achar code into an SID with fourteen contiguous
        # ranges, and a wrong range picks the wrong accent SILENTLY.
        # ⚠ `python3 scripts/cff_stdenc.py verify` cross-checks the embedded table against
        # fontTools; fontTools is not a dependency of this repo and that mode is not run here.
        run: |
          regen="$RUNNER_TEMP/cff_stdenc.regen.cyr"
          python3 scripts/cff_stdenc.py emit "$regen"
          if ! cmp -s programs/cff_stdenc_vectors.cyr "$regen"; then
            echo "ERROR: programs/cff_stdenc_vectors.cyr is stale."
            echo "Run 'python3 scripts/cff_stdenc.py emit' and commit the result."
            exit 1
          fi
          echo "programs/cff_stdenc_vectors.cyr matches the CFF Standard Encoding"

      - name: Verify the Macintosh Roman vectors
        # Same shape as the two gates above, for the third table rekha carries that nothing
        # derives: a `name` record on platform 1 encoding 0 is Mac OS Roman, whose high half is
        # 128 fixed entries. src/name.cyr holds them as hex chunks; this file is the independent
        # half, generated from PYTHON'S OWN `mac_roman` codec, and programs/name_test.cyr drives
        # the decoder with it. One wrong entry is one wrong character in a font's name — the
        # quietest failure in the table.
        run: |
          regen="$RUNNER_TEMP/mac_roman.regen.cyr"
          python3 scripts/mac_roman.py emit "$regen"
          if ! cmp -s programs/mac_roman_vectors.cyr "$regen"; then
            echo "ERROR: programs/mac_roman_vectors.cyr is stale."
            echo "Run 'python3 scripts/mac_roman.py emit programs/mac_roman_vectors.cyr' and commit."
            exit 1
          fi
          echo "programs/mac_roman_vectors.cyr matches Python's mac_roman codec"

      - name: Verify the embedded default face is in sync with its source .ttf
        # fonts/face_data.cyr is GENERATED from fonts/LiberationSans-Regular.ttf by
        # scripts/face2cyr.py and lives outside src/ on purpose: cyrfmt refuses files over
        # 1028 KB, and the module is data, not code. This gate is what keeps the two from
        # drifting — regenerate into a temp file and require a byte-identical result.
        run: |
          regen="$RUNNER_TEMP/face_data.regen.cyr"
          python3 scripts/face2cyr.py fonts/LiberationSans-Regular.ttf "$regen"
          if ! cmp -s fonts/face_data.cyr "$regen"; then
            echo "ERROR: fonts/face_data.cyr is stale. Run scripts/face2cyr.py and commit the result."
            exit 1
          fi
          echo "fonts/face_data.cyr matches fonts/LiberationSans-Regular.ttf"

      - name: Build & run (smoke + RUN suites, DCE off and on)
        # Every programs/*_test.cyr is a self-checking RUN test: it draws/acts, asserts pixel/state,
        # and exits non-zero on failure. Globbed, so new suites are auto-picked — including
        # programs/hostile_test.cyr (malformed-font corpus + sentinel differential + face mutation
        # loop, in-process, no fork) and the negative suites glyf_neg / extent / cmap_ext /
        # composite_flags / path_start. NOTE: no test blits to /dev/fb0.
        # ⛔ A build that prints `warning: undefined function` still exits 0 and links a binary that
        # dies at the first call (SIGILL 132, or SIGSEGV 139 under DCE) — see the [deps.sadish]
        # note in cyrius.cyml. So every build log is grepped for `warning`, `undefined function` and
        # `refusing to emit`, under BOTH CYRIUS_DCE=0 and 1, and every binary, smoke included,
        # must run to rc 0. The log goes to a file so the grep cannot mask the build rc.
        # ⚠ `cyrius coverage` is NOT a gate here: it builds its corpus from tests/**/*.tcyr only
        # and is blind to programs/, so it reports ~0% for a fully exercised API. The gates are
        # these RUN suites and the hostile corpus.
        run: |
          mkdir -p build
          logs="$RUNNER_TEMP/buildlogs"
          mkdir -p "$logs"
          fail=0
          for dce in 0 1; do
            for t in programs/smoke.cyr programs/*_test.cyr; do
              [ -e "$t" ] || continue
              name="$(basename "$t" .cyr)-dce$dce"
              log="$logs/$name.log"
              echo "== $t (CYRIUS_DCE=$dce) =="
              rc=0
              CYRIUS_DCE=$dce cyrius build "$t" "build/$name" > "$log" 2>&1 || rc=$?
              cat "$log"
              if [ "$rc" -ne 0 ]; then
                echo "BUILD FAIL: $t (DCE=$dce, rc=$rc)"; fail=1; continue
              fi
              if grep -nE 'warning|undefined function|refusing to emit' "$log"; then
                echo "BUILD FAIL: $t (DCE=$dce): warning / undefined function / refusing to emit in the build log"
                fail=1; continue
              fi
              rc=0
              "./build/$name" || rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "RUN FAIL: $t (DCE=$dce, rc=$rc)"; fail=1
              fi
            done
          done
          [ $fail -eq 0 ] || { echo "build/run gate failed"; exit 1; }
          echo "smoke (DCE on): $(wc -c < build/smoke-dce1) bytes"

      - name: Verify ELF
        run: '[ "$(xxd -l 4 -p build/smoke-dce1)" = "7f454c46" ]'

      - name: Cross-target link-check (aarch64 + AGNOS)
        # ⭐ WHY THIS GATE EXISTS. rekha's first line calls it "a subsystem for AGNOS", and nothing
        # had ever built it for AGNOS or for aarch64 — CI is one x86_64 host. 0.5.0 found what that
        # hides: src/error.cyr wrote to fd 2 through the LITERAL x86_64 write number, `syscall(1, 2,
        # ...)`, and shipped it in dist/rekha.cyr and dist/rekha-woff.cyr. On aarch64 `write` is 64
        # and 1 is `io_destroy`. The function is gone (library code now makes no syscall at all, and
        # the security scan below gates that), but the BLIND SPOT is what this step closes.
        # ⚠ Link-check only: these binaries are not run, there being no aarch64 or AGNOS host here.
        # programs/ keeps its raw write/exit numbers deliberately — host-only tests, never
        # cross-compiled — so the smoke program is what is built, and it links the full include
        # chain through src/lib.cyr.
        # Same shape as sadish's own step, which is where rekha took it from.
        run: |
          mkdir -p build
          fail=0
          for tgt in aarch64 agnos; do
            echo "== --$tgt =="
            out=$(cyrius build "--$tgt" programs/smoke.cyr "build/smoke-$tgt" 2>&1) || {
              echo "$out"; echo "cross: --$tgt failed to build"; fail=1; continue; }
            echo "$out"
            if grep -qE 'raw syscall|warning|undefined function|refusing to emit' <<< "$out"; then
              echo "cross: --$tgt build log is not clean"; fail=1; continue
            fi
            echo "  ok: $(wc -c < "build/smoke-$tgt") bytes"
          done
          [ $fail -eq 0 ] || { echo "cross-target link-check failed"; exit 1; }

      - name: Bench (hot path — visibility only, never gates)
        # Shared runners are noisy: numbers are printed, never thresholded. Allocation cost is
        # gated exactly by alloc_test. Skips cleanly if programs/bench_hotpath.cyr is absent.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ ! -e programs/bench_hotpath.cyr ]; then
            echo "no programs/bench_hotpath.cyr: skipping"
            exit 0
          fi
          CYRIUS_DCE=1 cyrius build programs/bench_hotpath.cyr build/bench_hotpath
          ./build/bench_hotpath

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan for process spawning and non-allowlisted syscalls
        # ALLOWLIST, not a denylist of spellings: rekha is a pure parser. ⛔ Library code (src/,
        # the shipped dist/ bundles, the fonts/ data module) may make NO raw syscall at all — it
        # computes and returns, and every byte it writes goes into a buffer the caller owns. That
        # was not true before 0.5.0: src/error.cyr's rekha_err_print_name wrote to fd 2 through the
        # literal x86_64 write number, which is `io_destroy` on aarch64, and it shipped in both
        # bundles. Removing it (rather than taking the stdlib's dispatched SYS_WRITE, which would
        # have added a leaf to dist/rekha.deps) makes the invariant the simple one gated here.
        # Test programs may write (1) and exit (60); they are host-only and never cross-compiled.
        # Any process-spawn wrapper, constant, name, process/dlopen include or inline `asm` block
        # fails anywhere. Matches code lines only — a line whose first non-blank character is `#`
        # is a comment.
        run: |
          export LC_ALL=C
          shopt -s nullglob
          FAIL=0
          # code_lines <grep-ERE> <files...>: "file:line:text" for matching non-comment lines.
          code_lines() {
            local pat="$1"; shift
            [ "$#" -gt 0 ] || return 0
            { grep -anHE -- "$pat" "$@" || true; } | awk -F: '
              { line = $3; for (i = 4; i <= NF; i++) line = line ":" $i
                sub(/^[ \t]+/, "", line)
                if (substr(line, 1, 1) != "#") print $1 ":" $2 ":" line }'
          }
          # syscall_offenders <allowed-prefix-ERE> <files...>: code lines still holding a
          # `syscall(` after every allowed occurrence is removed (so an allowed call cannot
          # shelter a second one on the same line).
          syscall_offenders() {
            local allow="$1"; shift
            code_lines 'syscall[[:space:]]*[(]' "$@" | awk -v allow="$allow" '
              { text = $0; sub(/^[^:]*:[^:]*:/, "", text); gsub(allow, "", text)
                if (text ~ /syscall[ \t]*[(]/) print }'
          }
          report() {
            if [ -n "$2" ]; then echo "FAIL: $1"; echo "$2"; FAIL=1; fi
          }
          # Every TRACKED Cyrius source, at any depth (a shell glob missed nested dirs and tests/tcyr).
          mapfile -t LIB < <(git ls-files -- 'src/*.cyr' 'dist/*.cyr' 'fonts/*.cyr')
          mapfile -t PROG < <(git ls-files -- '*.cyr' '*.tcyr' ':!:src/' ':!:dist/' ':!:fonts/')
          [ "${#LIB[@]}" -gt 0 ] || { echo "FAIL: no library sources found (git ls-files)"; exit 1; }
          SPAWN='\b(sys_(execve|execveat|execwait|exec_redirect|fork|vfork|clone|clone3|system|spawn|spawn_path|spawn_path_env)|exec_(cmd|vec|vec_str|capture|capture_str|env|env_str)|_exec3|spawn|run_capture|SYS_(EXECVE|EXECVEAT|EXECWAIT|EXEC_REDIRECT|FORK|VFORK|CLONE|CLONE3|SPAWN|SPAWN_PATH))\b'
          report "process-spawn name" "$(code_lines "$SPAWN" "${LIB[@]}" "${PROG[@]}")"
          # lib/process.cyr (spawn/run/exec_*) and the dlopen family resolve from the toolchain
          # even though [deps].stdlib does not list them, so the include itself is refused.
          report "process/dlopen stdlib module included" \
            "$(code_lines 'include[[:space:]]*"lib/(process|fdlopen|dynlib|cffi)' "${LIB[@]}" "${PROG[@]}")"
          # `asm { 0x0F; 0x05; }` is a raw syscall no `syscall(` pattern can see.
          report "inline asm" "$(code_lines '\basm\b' "${LIB[@]}" "${PROG[@]}")"
          report "raw syscall in library code (src/, dist/, fonts/ must make none)" \
            "$(code_lines 'syscall[[:space:]]*[(]' "${LIB[@]}")"
          report "raw syscall other than write/exit in programs" \
            "$(syscall_offenders 'syscall[(](1|60), ' "${PROG[@]}")"
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING (required): $f"; MISSING=1; fi
          done
          for f in CONTRIBUTING.md SECURITY.md LICENSE; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  WARN (optional, not yet present): $f"; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION file: $VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          # ⛔ THE README CARRIES A `Version:` LINE AND NOTHING CHECKED IT. It read 0.3.4 while
          # VERSION said 0.3.6 — two releases stale, and the CHANGELOG check above was green for
          # both of them, because it only ever looked at CHANGELOG.md. A version printed where a
          # newcomer reads it FIRST is the one worth checking. (Same gate dhancha added after its
          # own README sat twenty-one releases stale.)
          if grep -q '^Version:' README.md; then
            RV=$(awk '/^Version:/ { print $2; exit }' README.md)
            [ "$RV" = "$VERSION" ] || { echo "FAIL: README.md Version ($RV) != VERSION ($VERSION)"; exit 1; }
          fi
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
